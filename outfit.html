<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Outfit Suggestion</title>
    <style>
        body {
            font-family: 'Raleway', sans-serif;
            background-color: #85cae0;
            text-align: center;
            margin-top: 50px;
        }
        h1 {
            font-size: 40px;
            color: #000000;
        }
        p {
            font-size: 25px;
        }
    </style>
</head>
<body>
    <h1>Suggested Outfit</h1>
    <p><strong>Weather Condition:</strong> {{weather_condition}}</p>
    <p><strong>Headwear:</strong> {{outfit['headwear']}}</p>
    <p><strong>Shirt:</strong> {{outfit['shirt']}}</p>
    <p><strong>Pants:</strong> {{ outfit['pants']}}</p>
    <p><strong>Jacket:</strong> {{ outfit['jacket'] }}</p>
    <p><strong>Shoes:</strong> {{ outfit['shoes'] }}</p>
    <p><strong>Other:</strong> {{ outfit['other'] }}</p>
</body>
</html>
